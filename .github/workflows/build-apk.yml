name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dipendenze
        run: flutter pub get

      - name: Generazione codice (freezed, json_serializable, drift)
        run: dart run build_runner build

      - name: Analisi
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Rinomina APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/spesa-trento-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: spesa-trento-apk
          path: dist/*.apk
          retention-days: 30

      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
